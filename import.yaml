# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#yamlPreprocessor=on

# Wasp hello world — small production environment.
# Import once to create the project, or import services/env to an existing project.
project:
  name: wasp-hello-world-small-prod
  envVariables:
    REACT_APP_API_URL: https://api-${zeropsSubdomainHost}-3001.prg1.zerops.app
    WASP_SERVER_URL: https://api-${zeropsSubdomainHost}-3001.prg1.zerops.app
    WASP_WEB_CLIENT_URL: https://client-${zeropsSubdomainHost}.prg1.zerops.app
  envSecrets:
    # Required by Wasp in production — without it the API exits on startup (502).
    JWT_SECRET: <@generateRandomString(<64>)>

services:
  - hostname: client
    type: static
    zeropsSetup: prod-client
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125

  - hostname: api
    type: nodejs@24
    zeropsSetup: prod-api
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  - hostname: db
    type: postgresql:single@16
    profile: oltp-staging
    priority: 10
