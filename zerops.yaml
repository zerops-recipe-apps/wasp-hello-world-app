# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
# The 'prod-client' setup builds the Wasp React SPA for Nginx serving.
# The 'prod-api' setup runs the bundled Node.js server with Prisma migrations.
# The 'dev' setup deploys full source code for live development via SSH.
zerops:
  # Production client: compiles the Wasp React SPA into static
  # assets for Nginx. Requires REACT_APP_API_URL at build time so
  # the bundle points at the co-deployed API service.
  - setup: prod-client
    build:
      base: nodejs@24
      buildCommands:
        - npm install --min-release-age=0
        - npx wasp install
        - npx wasp build
        - npm run build:client
      envVariables:
        RUNTIME_APP_ENV: production
        # Baked into the SPA at build time — must match project REACT_APP_API_URL in import.yaml.
        REACT_APP_API_URL: ${REACT_APP_API_URL}

      deployFiles:
        # Strip build/ prefix — index.html + assets become the Nginx docroot.
        - .wasp/out/web-app/build/~

      cache:
        - node_modules

    run:
      base: static

  # Production API: bundle via scripts/bundle-server.sh, clean deploy tree
  # (prepare-api-deploy.cjs — same idea as nextjs-ssr migrate.cjs / nestjs dist+node_modules).
  - setup: prod-api
    build:
      base: nodejs@24
      os: ubuntu
      buildCommands:
        - NPM_CONFIG_PRODUCTION=false NPM_CONFIG_ENGINE_STRICT=false NPM_CONFIG_AUDIT=false npm install --min-release-age=0
        - npx wasp install
        - npx wasp build
        - node scripts/patch-api-root.cjs
        - cp -R migrations/. .wasp/out/db/migrations/
        - sh scripts/bundle-server.sh
        - node scripts/prepare-api-deploy.cjs
        - test -f .zerops/deploy/.wasp/out/server/bundle/server.js
        - test -d .zerops/deploy/.wasp/out/server/node_modules/@wasp.sh/lib-auth
        - test -d .zerops/deploy/node_modules/prisma

      deployFiles:
        - .zerops/deploy/~

      cache:
        - node_modules

    deploy:
      readinessCheck:
        httpGet:
          port: 3001
          path: /auth/me

    run:
      base: nodejs@24
      os: ubuntu
      initCommands:
        # Separate execOnce keys — migrate and seed must both run once per deploy.
        - zsc execOnce ${appVersionId}-migrate --retryUntilSuccessful -- node scripts/migrate-prod.cjs
        - zsc execOnce ${appVersionId}-seed --retryUntilSuccessful -- node scripts/seed-demo-user.cjs
      ports:
        - port: 3001
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: 3001
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        APP_DB_NAME: ${db_dbName}
        JWT_SECRET: wasp-zerops-hello-world-demo-jwt-v1
        # Wasp 0.25 prod server env — inherit public URLs from import.yaml project env.
        WASP_SERVER_URL: ${WASP_SERVER_URL}
        WASP_WEB_CLIENT_URL: ${WASP_WEB_CLIENT_URL}
      start: sh -c 'cd .wasp/out/server && NODE_ENV=production node --enable-source-maps bundle/server.js'

  # Dev setup: deploys full source so a developer or agent can SSH
  # in and run `wasp start` (client :3000, server :3001).
  - setup: dev
    build:
      base: nodejs@24
      os: ubuntu
      buildCommands:
        - npm install --min-release-age=0
        - npx wasp install
      deployFiles: ./
      cache:
        - node_modules

    run:
      base: nodejs@24
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
        - port: 3001
          httpSupport: true
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        APP_DB_NAME: ${db_dbName}
      start: zsc noop --silent
