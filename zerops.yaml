# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
# The 'prod-client' setup builds the Wasp React SPA for Nginx serving.
# The 'prod-api' setup runs the bundled Node.js server with Prisma migrations.
# The 'dev' setup deploys full source code for live development via SSH.
zerops:
  # Production client: compiles the Wasp React SPA into static
  # assets for Nginx. Requires REACT_APP_API_URL at build time so
  # the bundle points at the co-deployed API service.
  - setup: prod-client
    build:
      base: nodejs@24
      buildCommands:
        - NPM_CONFIG_PRODUCTION=false NPM_CONFIG_ENGINE_STRICT=false NPM_CONFIG_AUDIT=false npm install --min-release-age=0
        - npx wasp install
        # Generate src/build-env.ts with Wasp version, build timestamp,
        # and environment — Vite inlines this into the client bundle.
        - node scripts/generate-build-env.cjs
        - npx wasp build
        # build:client copies Wasp's 200.html → index.html for Nginx.
        - npm run build:client
      envVariables:
        RUNTIME_APP_ENV: production

      deployFiles:
        # Strip build/ prefix — index.html + assets become the Nginx docroot.
        - .wasp/out/web-app/build/~

      cache:
        - node_modules
        - .wasp/out

    run:
      base: static

  # Production API: Wasp Node.js server with Prisma. Deploys the
  # pre-bundled Express app from .wasp/out/server/bundle/.
  - setup: prod-api
    build:
      base: nodejs@24
      # Ubuntu — Prisma migrate needs OpenSSL; Alpine defaults break the engine
      # (see Wasp Dockerfile: apk add openssl on Alpine).
      os: ubuntu
      buildCommands:
        # Install devDependencies too — prisma CLI lives there and is needed at runtime init.
        - NPM_CONFIG_PRODUCTION=false NPM_CONFIG_ENGINE_STRICT=false NPM_CONFIG_AUDIT=false npm install --min-release-age=0
        - npx wasp install
        - npx wasp build
        - cp -R migrations/. .wasp/out/db/migrations/
        - cd .wasp/out/server && npm run bundle
        # Drop Wasp CLI symlinks — deploy target is missing from deployFiles.
        - rm -f node_modules/wasp node_modules/.bin/wasp
        - test -d .wasp/out/db/migrations
        - test -f .wasp/out/server/bundle/server.js

      deployFiles:
        - node_modules
        - scripts/migrate-prod.cjs
        - scripts/database-url.cjs
        - scripts/seed-demo-user.cjs
        - .wasp/out/server/bundle
        - .wasp/out/server/node_modules
        - .wasp/out/server/package.json
        - .wasp/out/db

      cache:
        - node_modules
        - .wasp/out

    deploy:
      readinessCheck:
        httpGet:
          port: 3001
          path: /

    run:
      base: nodejs@24
      os: ubuntu
      initCommands:
        - zsc execOnce ${appVersionId} --retryUntilSuccessful -- node scripts/migrate-prod.cjs
        - zsc execOnce ${appVersionId} --retryUntilSuccessful -- node scripts/seed-demo-user.cjs
      ports:
        - port: 3001
          httpSupport: true
      envVariables:
        NODE_ENV: production
        # Explicit db name — ${db_connectionString} can target the "postgres"
        # maintenance DB where the app user lacks CREATE on schema public (PG 15+).
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        ZEROPS_DB_NAME: ${db_dbName}
        # Demo-only fixed secret — zero manual setup on redeploy. Wasp requires
        # JWT_SECRET in production; do not reuse this value outside this recipe.
        JWT_SECRET: wasp-zerops-hello-world-demo-jwt-v1
      # Migrations run in initCommands — start the bundled server directly.
      # start-production re-runs prisma migrate deploy, but prisma lives in root
      # node_modules (not .wasp/out/server), and JWT/env validation happens only
      # after that redundant step.
      start: sh -c 'cd .wasp/out/server && NODE_ENV=production node --enable-source-maps bundle/server.js'

  # Dev setup: deploys full source so a developer or agent can SSH
  # in and run `wasp start` (client :3000, server :3001).
  - setup: dev
    build:
      base: nodejs@24
      os: ubuntu
      buildCommands:
        - npm install --min-release-age=0
        - npx wasp install
      deployFiles: ./
      cache:
        - node_modules

    run:
      base: nodejs@24
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
        - port: 3001
          httpSupport: true
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        ZEROPS_DB_NAME: ${db_dbName}
      start: zsc noop --silent
