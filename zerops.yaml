  # Dev setup: deploys full source so a developer or agent can SSH
  # in and run `wasp start` (client :3000, server :3001).
  - setup: dev
    build:
      base: nodejs@24
      os: ubuntu
      buildCommands:
        - npm install --ignore-scripts=false
        - npm install -g @wasp.sh/wasp-cli@0.25.0 --ignore-scripts=false
      deployFiles: ./
      cache:
        - node_modules

    run:
      base: nodejs@24
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
        - port: 3001
          httpSupport: true
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/db
      start: zsc noop --silent
